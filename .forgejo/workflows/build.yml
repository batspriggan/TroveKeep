on:
  push:
    tags:
      - 'lv*'

jobs:
  build:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - run: |
          echo "Building TroveKeep Docker image..."
          VERSION="${GITHUB_REF_NAME#lv}"
          docker build \
            -t 192.168.10.21:3333/alex/trovekeep:latest \
            -t 192.168.10.21:3333/alex/trovekeep:$VERSION \
            --build-arg VITE_APP_VERSION=$VERSION \
            .
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login 192.168.10.21:3333 -u alex --password-stdin
          docker push 192.168.10.21:3333/alex/trovekeep:latest
          docker push 192.168.10.21:3333/alex/trovekeep:$VERSION
