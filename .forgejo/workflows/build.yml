on:
  push:
    tags:
      - 'lv*'

env:
  # Configure these as repository (or organization) variables in Forgejo:
  #   Settings → Actions → Variables
  # REGISTRY_HOST   e.g. registry.example.com:5000
  # REGISTRY_USER   e.g. alex
  # IMAGE_NAME      e.g. alex/trovekeep
  # The registry password must be stored as the secret REGISTRY_PASSWORD.
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
  REGISTRY_USER: ${{ vars.REGISTRY_USER }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  build:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" \
            | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin

      - name: Build and push image
        run: |
          echo "Building TroveKeep Docker image..."
          VERSION="${GITHUB_REF_NAME#lv}"
          IMAGE="${REGISTRY_HOST}/${IMAGE_NAME}"
          docker build \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${VERSION}" \
            --build-arg VITE_APP_VERSION="${VERSION}" \
            .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${VERSION}"
